name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'  # jalan otomatis tiap hari jam 00:00 UTC
  workflow_dispatch:      # supaya bisa dijalankan manual

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'space-shooter.gif'
          strategy: 'random'
